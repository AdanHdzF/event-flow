asyncapi: 3.0.0

info:
    title: Eventflow arquitectura orientada a eventos
    version: 1.0.0
    description: |
        Este es un ejemplo de una arquitectura orientada a eventos utilizando AsyncAPI. En esta arquitectura, los servicios se comunican a través de eventos, lo que permite una mayor flexibilidad y escalabilidad.
    contact:
        name: Equipo de Soporte de Eventflow
        email: eventflow@support.com

    license:
        name: MIT

defaultContentType: application/json

servers:
    rabbitmq-dev:
        host: rabbitmq:5672
        description: RabbitMQ entorno de desarrollo.
        protocol: amqp
        security:
            - $ref: '#/components/schemas/securitySchemes/rabbitmqCredentials'
        tags:
            - name: development

    kafka-dev:
        host: kafka:9092
        description: Kafka entorno de desarrollo.
        protocol: kafka
        tags:
            - name: development

channels:
    orders.created:
        address: orders.created
        description: Canal para eventos de creación de órdenes.
        messages:
            orderCreatedEvent:
                $ref: '#/components/messages/orderCreatedEvent'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: eventflow
                    type: topic
                    durable: true
                    autoDelete: false

    orders.cancelled:
        address: orders.cancelled
        description: Canal para eventos de cancelación de órdenes.
        messages:
            orderCancelledEvent:
                $ref: '#/components/messages/orderCancelledEvent'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: eventflow
                    type: topic
                    durable: true
                    autoDelete: false

    inventory.reserved:
        address: inventory.reserved
        description: Canal para eventos de reserva de inventario.
        messages:
            inventoryReservedEvent:
                $ref: '#/components/messages/inventoryReservedEvent'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: eventflow
                    type: topic
                    durable: true
                    autoDelete: false

    payment.completed:
        address: payment.completed
        description: Canal para eventos de pago completado.
        messages:
            paymentCompletedEvent:
                $ref: '#/components/messages/paymentCompletedEvent'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: eventflow
                    type: topic
                    durable: true
                    autoDelete: false

operations:
    publishOrderCreated:
        action: send
        description: Publica un evento de creación de orden.
        channel:
            $ref: '#/channels/orders.created'
        tags:
            - name: orders

    publishOrderCancelled:
        action: send
        description: Publica un evento de cancelación de orden.
        channel:
            $ref: '#/channels/orders.cancelled'
        tags:
            - name: orders

    publishInventoryReserved:
        action: send
        description: Publica un evento de reserva de inventario.
        channel:
            $ref: '#/channels/inventory.reserved'
        tags:
            - name: inventory

    onOrderCreatedInventory:
        action: receive
        description: Recibe un evento de creación de orden.
        channel:
            $ref: '#/channels/orders.created'
        tags:
            - name: inventory

    onOrderCancelledInventory:
        action: receive
        description: Recibe un evento de cancelación de orden.
        channel:
            $ref: '#/channels/orders.cancelled'
        tags:
            - name: inventory

    publishPaymentCompleted:
        action: send
        description: Publica un evento de pago completado.
        channel:
            $ref: '#/channels/payment.completed'
        tags:
            - name: payment

    onOrderCreatedPayment:
        action: receive
        description: Recibe un evento de creación de orden.
        channel:
            $ref: '#/channels/orders.created'
        tags:
            - name: payment

components:
    messages:
        orderCreatedEvent:
            name: OrderCreatedEvent
            title: Evento de creación de orden
            description: Este evento se publica cuando se crea una nueva orden.
            contentType: application/json
            payload:
                $ref: '#/components/schemas/OrderCreatedPayload'
            examples:
                - name: laptopOrder
                  summary: Ejemplo de orden de laptop
                  payload:
                      product: 'laptop-123'
                      price: 999.99

        orderCancelledEvent:
            name: OrderCancelledEvent
            title: Evento de cancelación de orden
            description: Este evento se publica cuando se cancela una orden.
            contentType: application/json
            payload:
                $ref: '#/components/schemas/OrderCancelledPayload'
            examples:
                - name: laptopOrderCancelled
                  summary: Ejemplo de orden de laptop cancelada
                  payload:
                      id: 'uuid'
                      reason: 'Cliente solicitó la cancelación'

        inventoryReservedEvent:
            name: InventoryReservedEvent
            title: Evento de reserva de inventario
            description: Este evento se publica cuando se reserva inventario para una orden.
            contentType: application/json
            payload:
                $ref: '#/components/schemas/InventoryReservedPayload'
            examples:
                - name: laptopOrderReserved
                  summary: Ejemplo de orden de laptop con inventario reservado
                  payload:
                      product: 'laptop-123'
                      quantity: 1

        paymentCompletedEvent:
            name: PaymentCompletedEvent
            title: Evento de pago completado
            description: Este evento se publica cuando se completa un pago para una orden.
            contentType: application/json
            payload:
                $ref: '#/components/schemas/PaymentCompletedPayload'
            examples:
                - name: laptopPaymentCompleted
                  summary: Ejemplo de pago completado para una orden de laptop
                  payload:
                      orderId: '1324'

    schemas:
        OrderCreatedPayload:
            type: object
            properties:
                product:
                    type: string
                price:
                    type: number

        OrderCancelledPayload:
            type: object
            properties:
                id:
                    type: string
                reason:
                    type: string

        InventoryReservedPayload:
            type: object
            properties:
                product:
                    type: string
                    description: ID del producto en la orden.
                quantity:
                    type: integer
                    description: Cantidad de inventario reservada.

        PaymentCompletedPayload:
            type: object
            properties:
                orderId:
                    type: string
                    description: ID de la orden para la cual se completó el pago.

        securitySchemes:
            rabbitmqCredentials:
                type: userPassword
                description: Credenciales para autenticación en RabbitMQ.
